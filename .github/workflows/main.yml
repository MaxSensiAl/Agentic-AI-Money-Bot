name: World's Powerful Blogger Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests feedparser google-auth google-api-python-client

      - name: Execute Bot
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SHRINKME_API: ${{ secrets.SHRINKME_API }}
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python bot.py
