name: Super 30-Min Money Bot
on:
  schedule:
    - cron: '*/30 * * * *' # हर 30 मिनट में चलेगा
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests feedparser google-api-python-client google-auth
      - name: Execute
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          SHRINKME_API: ${{ secrets.SHRINKME_API }}
          GEMINI_API: ${{ secrets.GEMINI_API }}
        run: python bot.py
