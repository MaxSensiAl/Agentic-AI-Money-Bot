name: World's Powerful Blogger Bot

on:
  schedule:
    - cron: '0 */2 * * *'  # हर 2 घंटे में चलेगा
  workflow_dispatch:       # मैन्युअल रन बटन के लिए

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Bot
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          HF_TOKEN: ${{ secrets.GEMINI_API }}
          SHRINKME_API: ${{ secrets.SHRINKME_API }}
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
          BC_REFRESH_TOKEN: ${{ secrets.BC_REFRESH_TOKEN }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: python bot.py
