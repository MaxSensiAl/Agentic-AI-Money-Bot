name: World's Powerful Blogger Bot

on:
  schedule:
    # 🔥 HAR 1 GHANTE MEIN 1 POST (SEO Optimized)
    - cron: '0 * * * *'  # Every hour at minute 0
    
    # ✅ MANUAL RUN (Testing)
    workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute Bot
      env:
        BLOG_ID: ${{ secrets.BLOG_ID }}
        HF_TOKEN: ${{ secrets.GEMINI_API_KEY }}
        SHRINKME_API: ${{ secrets.SHRINKME_API_KEY }}
        BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
        BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        BC_REFRESH_TOKEN: ${{ secrets.BC_REFRESH_TOKEN }}
        SERVICE_ACCOUNT_USERNAME: ${{ secrets.SERVICE_ACCOUNT_USERNAME }}
      run: python bot.py
